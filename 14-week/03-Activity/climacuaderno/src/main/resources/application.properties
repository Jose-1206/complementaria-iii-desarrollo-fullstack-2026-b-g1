spring.application.name=climacuaderno
server.port=${PORT:8080}

# Local file database by default. Docker uses /app/data under the working directory.
spring.datasource.url=${DB_JDBC_URL:jdbc:h2:file:./data/climacuaderno;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Strict startup validation happens in SecurityConfiguration.
app.jwt-secret=${JWT_SECRET:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5500}

# Keep Jackson output consistent with the frontend's existing API contract.
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=never
